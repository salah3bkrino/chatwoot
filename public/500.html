<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Server Error | Automation Service</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --primary: #6C63FF;
      --primary-light: #8b85ff;
      --primary-dark: #4f46e5;
      --warn: #f97316;
      --warn-light: #fdba74;
    }
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: 'Inter', -apple-system, system-ui, sans-serif;
      background: linear-gradient(135deg, #fff7ed 0%, #ffedd5 50%, #fef9f5 100%);
      color: rgb(28, 32, 36);
      padding: 2rem 1.5rem;
      -webkit-font-smoothing: antialiased;
    }
    .page {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 30rem;
      text-align: center;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 0.625rem;
      margin-bottom: 3rem;
      text-decoration: none;
    }
    .brand-icon {
      width: 2.5rem;
      height: 2.5rem;
      background: var(--primary);
      border-radius: 0.625rem;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: 800;
      font-size: 1.1rem;
      box-shadow: 0 4px 14px rgba(108,99,255,0.35);
    }
    .brand-name {
      font-weight: 700;
      font-size: 1.1rem;
      color: #1e1b4b;
    }
    .error-number {
      font-size: 9rem;
      font-weight: 800;
      line-height: 1;
      letter-spacing: -0.04em;
      background: linear-gradient(135deg, #ef4444 0%, var(--warn) 60%, var(--warn-light) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 1.5rem;
      animation: shake 4s ease-in-out infinite;
    }
    @keyframes shake {
      0%, 90%, 100% { transform: translateX(0); }
      92% { transform: translateX(-4px); }
      94% { transform: translateX(4px); }
      96% { transform: translateX(-3px); }
      98% { transform: translateX(3px); }
    }
    .icon-wrap {
      width: 4rem;
      height: 4rem;
      background: linear-gradient(135deg, #fef3c7, #fde68a);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 1.5rem;
      font-size: 1.75rem;
    }
    h1 {
      font-size: 1.625rem;
      font-weight: 700;
      line-height: 1.3;
      margin-bottom: 0.75rem;
      color: #1e1b4b;
    }
    .description {
      font-size: 1rem;
      color: rgb(100, 100, 130);
      line-height: 1.7;
      margin-bottom: 2.5rem;
    }
    .actions {
      display: flex;
      gap: 0.75rem;
      flex-wrap: wrap;
      justify-content: center;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      background: var(--primary);
      color: #fff;
      font-size: 0.9375rem;
      font-weight: 600;
      padding: 0.8rem 2rem;
      border-radius: 0.75rem;
      text-decoration: none;
      transition: all 0.2s ease;
      box-shadow: 0 4px 14px rgba(108,99,255,0.35);
    }
    .btn:hover {
      background: var(--primary-dark);
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(108,99,255,0.45);
    }
    .btn-outline {
      background: transparent;
      color: var(--primary);
      border: 2px solid var(--primary);
      box-shadow: none;
    }
    .btn-outline:hover {
      background: rgba(108,99,255,0.06);
      transform: translateY(-1px);
      box-shadow: none;
    }
    .btn svg { width: 1.125rem; height: 1.125rem; }
    .divider {
      width: 3rem;
      height: 2px;
      background: linear-gradient(90deg, var(--warn), transparent);
      border-radius: 1px;
      margin: 2.5rem 0;
    }
    .help {
      font-size: 0.875rem;
      color: rgb(139, 141, 170);
      line-height: 1.6;
    }
    .help a {
      color: var(--primary);
      text-decoration: none;
      font-weight: 500;
    }
    .help a:hover { text-decoration: underline; }
    @media (max-width: 480px) {
      .error-number { font-size: 6rem; }
      h1 { font-size: 1.35rem; }
    }
  </style>
</head>
<body>
  <div class="page">
    <a href="/" class="brand">
      <div class="brand-icon">A</div>
      <span class="brand-name">Automation Service</span>
    </a>
    <div class="error-number">500</div>
    <h1>Something Went Wrong</h1>
    <p class="description">An unexpected server error occurred.<br>Our team has been notified. Please try again in a few moments.</p>
    <div class="actions">
      <a href="javascript:window.location.reload()" class="btn">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0 3.181 3.183a8.25 8.25 0 0 0 13.803-3.7M4.031 9.865a8.25 8.25 0 0 1 13.803-3.7l3.181 3.182m0-4.991v4.99" /></svg>
        Try Again
      </a>
      <a href="/" class="btn btn-outline">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="m2.25 12 8.954-8.955c.44-.439 1.152-.439 1.591 0L21.75 12M4.5 9.75v10.125c0 .621.504 1.125 1.125 1.125H9.75v-4.875c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125V21h4.125c.621 0 1.125-.504 1.125-1.125V9.75M8.25 21h8.25" /></svg>
        Go Home
      </a>
    </div>
    <div class="divider"></div>
    <p class="help">Problem persists? <a href="mailto:support@automationservice.cloud">Contact our support team</a></p>
  </div>
</body>
</html>
