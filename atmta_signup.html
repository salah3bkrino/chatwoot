<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>التسجيل - Atmta</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
</head>
<body class="bg-gradient-to-br from-slate-50 to-blue-50" dir="rtl">
    <div class="min-h-screen flex items-center justify-center p-4">
        <div class="w-full max-w-2xl">
            <div class="text-center mb-12">
                <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-gradient-to-br from-blue-500 to-green-500 text-white font-black text-2xl mb-6">A</div>
                <h1 class="text-4xl font-black mb-3">تفعيل حسابك</h1>
                <p class="text-slate-500">خطوة واحدة فقط للبدء</p>
            </div>

            <div class="bg-white rounded-3xl shadow-2xl p-8 md:p-12">
                <form id="form" class="space-y-6">
                    <div>
                        <label class="block text-sm font-bold text-slate-700 mb-3">اسم النشاط</label>
                        <input type="text" name="business" placeholder="متجري" required class="w-full px-5 py-3 rounded-xl border-2 border-slate-200 outline-none focus:border-blue-500" />
                    </div>

                    <div>
                        <label class="block text-sm font-bold text-slate-700 mb-3">نوع النشاط</label>
                        <select name="type" required class="w-full px-5 py-3 rounded-xl border-2 border-slate-200 outline-none focus:border-blue-500">
                            <option>متجر إلكتروني</option>
                            <option>خدمات</option>
                            <option>مطعم</option>
                            <option>أخرى</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-sm font-bold text-slate-700 mb-3">اسمك الكامل</label>
                        <input type="text" name="name" placeholder="أحمد محمد" required class="w-full px-5 py-3 rounded-xl border-2 border-slate-200 outline-none focus:border-blue-500" />
                    </div>

                    <div>
                        <label class="block text-sm font-bold text-slate-700 mb-3">البريد الإلكتروني</label>
                        <input type="email" name="email" placeholder="your@email.com" required class="w-full px-5 py-3 rounded-xl border-2 border-slate-200 outline-none focus:border-blue-500" />
                    </div>

                    <div>
                        <label class="block text-sm font-bold text-slate-700 mb-3">رقم الهاتف (WhatsApp)</label>
                        <div class="flex gap-3">
                            <span class="flex items-center px-4 rounded-xl border-2 border-slate-200 bg-slate-50 font-bold">+20</span>
                            <input type="tel" name="phone" placeholder="1064607957" pattern="[0-9]{10}" required class="flex-1 px-5 py-3 rounded-xl border-2 border-slate-200 outline-none focus:border-blue-500" />
                        </div>
                    </div>

                    <div>
                        <label class="block text-sm font-bold text-slate-700 mb-3">الباقة</label>
                        <div class="grid grid-cols-2 gap-4">
                            <label class="p-4 border-2 border-slate-200 rounded-xl cursor-pointer hover:border-blue-500">
                                <input type="radio" name="plan" value="Starter" required />
                                <div class="font-bold">Starter</div>
                                <div class="text-sm text-slate-500">$49/شهر</div>
                            </label>
                            <label class="p-4 border-2 border-blue-500 rounded-xl cursor-pointer bg-blue-50">
                                <input type="radio" name="plan" value="Enterprise" />
                                <div class="font-bold">Enterprise</div>
                                <div class="text-sm text-slate-500">$99/شهر</div>
                            </label>
                        </div>
                    </div>

                    <button type="submit" class="w-full bg-blue-600 text-white font-bold py-4 rounded-xl hover:bg-blue-700">
                        تفعيل الحساب
                    </button>
                </form>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('form').addEventListener('submit', function(e) {
            e.preventDefault();
            const data = {
                business: this.business.value,
                type: this.type.value,
                name: this.name.value,
                email: this.email.value,
                phone: '201' + this.phone.value,
                plan: this.plan.value
            };

            const msg = `طلب تفعيل جديد:
🏢 النشاط: ${data.business}
📋 النوع: ${data.type}
👤 الاسم: ${data.name}
📧 البريد: ${data.email}
📱 الهاتف: +${data.phone}
💰 الباقة: ${data.plan}`;

            window.open('https://wa.me/201064607957?text=' + encodeURIComponent(msg), '_blank');
        });
    </script>
</body>
</html>
